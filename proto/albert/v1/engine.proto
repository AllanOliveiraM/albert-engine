syntax = "proto3";
package albert.v1;
// All physical quantities use SI. Positions/velocities are geocentric ICRF.
// UTC timestamps are Unix seconds, not arrival times. Quaternion XYZW rotates
// model-local axes into ICRF. No implicit frame conversions are performed.
message Empty {}
message Vector3 { double x=1; double y=2; double z=3; }
message Quaternion { double x=1; double y=2; double z=3; double w=4; }
enum ReferenceFrame { REFERENCE_FRAME_UNSPECIFIED=0; GEOCENTRIC_ICRF=1; }
message State {
  double utc_unix_seconds=1;
  Vector3 position_meters=2;
  optional Vector3 velocity_meters_per_second=3;
  optional Quaternion attitude=4;
  ReferenceFrame frame=5;
}
message Geometry {
  enum Shape { SHAPE_UNSPECIFIED=0; SPHERE=1; BOX=2; CYLINDER=3; MODEL=4; }
  Shape shape=1;
  // Full diameters/extents along local X,Y,Z. Cylinder axis is local Y.
  Vector3 size_meters=2;
  optional uint32 color_rgb=3;
  // MODEL uses a registered GLB asset; its own colors and local origin.
  string model_id=4; optional double meters_per_model_unit=5;
}
message Object {
  string id=1; string name=2; string source=3;
  Geometry geometry=4; State state=5;
  bool builtin=6; bool visible=7; bool stale=8;
  double radius_meters=9;
  bool provider_managed=10;
}
message CreateObjectRequest { string id=1; string name=2; string source=3; Geometry geometry=4; State initial_state=5; }
message ObjectRequest { string id=1; }
message VisibilityRequest { string id=1; bool visible=2; }
// Up to 256 strictly increasing samples. Previously accepted timestamps must
// not be repeated. A rejected batch never partially changes an object's state.
message StateBatch { string id=1; repeated State samples=2; }
// This acknowledges application on the owner thread, not just enqueueing.
message Applied { uint64 revision=1; }
message Camera { string target_id=1; Vector3 position_meters=2; double distance_meters=3; bool transitioning=4; }
message ClockStatus {
  enum Quality { LOCAL=0; SYNCHRONIZED=1; HOLDOVER=2; EXPIRED=3; }
  Quality quality=1; double utc_unix_seconds=2;
  // Negative means unknown (local fallback); estimates are not hard bounds.
  double uncertainty_seconds=3; double last_sync_utc_unix_seconds=4;
  double age_seconds=5; double round_trip_seconds=6;
  string source=7; bool authenticated=8; bool synchronizing=9;
  string error=10; uint64 generation=11; double pending_correction_seconds=12;
}
message Scene { uint64 revision=1; double utc_unix_seconds=2; repeated Object objects=3; Camera camera=4; ClockStatus clock=5; }
message FocusRequest { string id=1; bool reset_zoom=2; }
message OrbitRequest { double azimuth_radians=1; double elevation_radians=2; optional double distance_scale=3; }
message StreamSummary { uint64 applied_batches=1; uint64 revision=2; }
message Capabilities { repeated ReferenceFrame frames=1; uint32 max_objects=2; uint32 max_samples_per_batch=3; repeated Geometry.Shape shapes=4; bool catalog_available=5; uint32 max_model_bytes=6; uint32 max_layers=7; uint32 max_layer_input_points=8; }
service SceneService {
  rpc GetScene(Empty) returns (Scene);
  rpc GetCapabilities(Empty) returns (Capabilities);
  rpc CreateObject(CreateObjectRequest) returns (Applied);
  rpc RemoveObject(ObjectRequest) returns (Applied);
  rpc SetVisibility(VisibilityRequest) returns (Applied);
  rpc PushStates(StateBatch) returns (Applied);
  // Backpressure: up to 32 pending batches per stream, with a bounded global
  // queue. Summary counts applied batches. Rendering uses time interpolation
  // and holds the last state after stream loss.
  rpc StreamStates(stream StateBatch) returns (StreamSummary);
}
service CameraService {
  // Tracking keeps manual orbit and zoom available. Reserved context IDs:
  // @earth-moon and @system. Removing the tracked object focuses Earth.
  rpc Focus(FocusRequest) returns (Applied);
  rpc Orbit(OrbitRequest) returns (Applied);
  rpc GetCamera(Empty) returns (Camera);
}

service TimeService {
  // Same immutable frame snapshot as GetScene. No OS clock modification.
  rpc GetTime(Empty) returns (ClockStatus);
}

message CatalogQuery { string query=1; }
message CatalogItem {
  string id=1; string name=2; string provider=3;
  double reference_radius_meters=4; bool present_in_scene=5;
  string representation=6;
}
message CatalogList { repeated CatalogItem items=1; }
message ImportCatalogObjectRequest {
  string catalog_id=1; string object_id=2;
  bool focus_camera=3; optional uint32 color_rgb=4;
}
message CatalogJob {
  enum Stage { QUEUED=0; LOADING=1; APPLYING=2; TRACKING=3; DEGRADED=4; FAILED=5; REMOVED=6; }
  uint64 id=1; string catalog_id=2; string object_id=3; Stage stage=4;
  string error=5; double fetched_utc_unix_seconds=6;
  double valid_until_utc_unix_seconds=7; uint64 applied_revision=8;
}
message CatalogJobRequest { uint64 id=1; }
message CatalogJobs { repeated CatalogJob jobs=1; }
service CatalogService {
  // First catalog: known Solar System bodies, real Horizons positions and
  // explicit simplified spheres. Detailed bundled bodies are not replaced.
  rpc ListObjects(CatalogQuery) returns (CatalogList);
  // Returns an asynchronous job; TRACKING confirms owner-thread application.
  // Imported objects are refreshed automatically until removed from the scene.
  rpc ImportObject(ImportCatalogObjectRequest) returns (CatalogJob);
  rpc GetJob(CatalogJobRequest) returns (CatalogJob);
  rpc GetJobs(Empty) returns (CatalogJobs);
  rpc RetryJob(CatalogJobRequest) returns (CatalogJob);
}

message RegisterModelRequest { string id=1; string source=2; bytes glb=3; }
message ModelAsset {
  string id=1; string source=2; uint64 bytes=3;
  uint32 vertices=4; uint32 triangles=5;
  Vector3 size_model_units=6; double radius_model_units=7;
}
message ModelAssets { repeated ModelAsset assets=1; }
service AssetService {
  // Bounded static opaque GLB 2; embedded geometry, local hierarchy and PBR
  // solid materials. Textures, animations, skins and extensions are rejected.
  rpc RegisterModel(RegisterModelRequest) returns (Applied);
  rpc ListModels(Empty) returns (ModelAssets);
  // Remove dependent scene objects first. Asset IDs are immutable while used.
  rpc RemoveModel(ObjectRequest) returns (Applied);
}

message GeographicPoint { double longitude_degrees=1; double latitude_degrees=2; }
message CreateLayerRequest {
  enum Kind { KIND_UNSPECIFIED=0; POINTS=1; POLYLINE=2; }
  enum Frame { FRAME_UNSPECIFIED=0; GEOCENTRIC_ICRF=1; OBJECT_LOCAL=2; EARTH_SURFACE=3; }
  string id=1; string name=2; string source=3; string anchor_id=4;
  Kind kind=5; Frame frame=6;
  repeated Vector3 positions_meters=7; repeated GeographicPoint geographic_points=8;
  optional uint32 color_rgb=9; optional float width_pixels=10;
  // Earth surface only: positive clearance over the displayed terrain.
  optional double clearance_meters=11;
}
message Layer {
  string id=1; string name=2; string source=3; string anchor_id=4;
  CreateLayerRequest.Kind kind=5; CreateLayerRequest.Frame frame=6;
  uint32 point_count=7; uint32 color_rgb=8; float width_pixels=9;
  double clearance_meters=10; bool visible=11;
}
message Layers { repeated Layer layers=1; }
service LayerService {
  rpc CreateLayer(CreateLayerRequest) returns (Applied);
  rpc ListLayers(Empty) returns (Layers);
  rpc SetVisibility(VisibilityRequest) returns (Applied);
  rpc RemoveLayer(ObjectRequest) returns (Applied);
}
