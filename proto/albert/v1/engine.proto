syntax = "proto3";
package albert.v1;
// All physical quantities use SI. Positions/velocities are geocentric ICRF.
// UTC timestamps are Unix seconds, not arrival times. Quaternion XYZW rotates
// model-local axes into ICRF. No implicit frame conversions are performed.
message Empty {}
message Vector3 { double x=1; double y=2; double z=3; }
message Quaternion { double x=1; double y=2; double z=3; double w=4; }
enum ReferenceFrame { REFERENCE_FRAME_UNSPECIFIED=0; GEOCENTRIC_ICRF=1; }
message State {
  double utc_unix_seconds=1;
  Vector3 position_meters=2;
  optional Vector3 velocity_meters_per_second=3;
  optional Quaternion attitude=4;
  ReferenceFrame frame=5;
}
message Geometry {
  enum Shape { SHAPE_UNSPECIFIED=0; SPHERE=1; BOX=2; CYLINDER=3; MODEL=4; }
  Shape shape=1;
  // Full diameters/extents along local X,Y,Z. Cylinder axis is local Y.
  Vector3 size_meters=2;
  optional uint32 color_rgb=3;
  // MODEL uses a registered GLB asset; its own colors and local origin.
  string model_id=4; optional double meters_per_model_unit=5;
}
message Object {
  string id=1; string name=2; string source=3;
  Geometry geometry=4; State state=5;
  bool builtin=6; bool visible=7; bool stale=8;
  double radius_meters=9;
  bool provider_managed=10;
}
message CreateObjectRequest { string id=1; string name=2; string source=3; Geometry geometry=4; State initial_state=5; }
message ObjectRequest { string id=1; }
message VisibilityRequest { string id=1; bool visible=2; }
// Up to 256 strictly increasing samples. Previously accepted timestamps must
// not be repeated. A rejected batch never partially changes an object's state.
message StateBatch { string id=1; repeated State samples=2; }
// This acknowledges application on the owner thread, not just enqueueing.
message Applied { uint64 revision=1; }
message Camera { string target_id=1; Vector3 position_meters=2; double distance_meters=3; bool transitioning=4; }
message ClockStatus {
  enum Quality { LOCAL=0; SYNCHRONIZED=1; HOLDOVER=2; EXPIRED=3; }
  Quality quality=1; double utc_unix_seconds=2;
  // Negative means unknown (local fallback); estimates are not hard bounds.
  double uncertainty_seconds=3; double last_sync_utc_unix_seconds=4;
  double age_seconds=5; double round_trip_seconds=6;
  string source=7; bool authenticated=8; bool synchronizing=9;
  string error=10; uint64 generation=11; double pending_correction_seconds=12;
  // Instant of the scene states: equals utc_unix_seconds while live.
  SimulationTime simulation=13;
}
// rate: simulated seconds per second (0 paused, negative backwards). limited: held
// at the first or last supported instant. generation changes on date jumps and on
// returning to live time, not on rate changes.
// approximate_positions: the Sun, Moon and planets come from analytic models (ERFA)
// while JPL tables for the instant load or are unavailable.
message SimulationTime { double utc_unix_seconds=1; double rate=2; bool live=3; bool limited=4; uint64 generation=5; bool approximate_positions=6; }
// Unset fields keep their value; live=true ignores both and follows the real clock.
message SetTimeRequest { optional double utc_unix_seconds=1; optional double rate=2; bool live=3; }
// utc_unix_seconds is the simulated instant of the object states (see ClockStatus.simulation).
message Scene { uint64 revision=1; double utc_unix_seconds=2; repeated Object objects=3; Camera camera=4; ClockStatus clock=5; }
message FocusRequest { string id=1; bool reset_zoom=2; }
// A bare file name ending in .png (letters, digits, '.', '_', '-'; at most 80 characters).
message CaptureRequest { string file_name=1; }
message OrbitRequest { double azimuth_radians=1; double elevation_radians=2; optional double distance_scale=3; }
message StreamSummary { uint64 applied_batches=1; uint64 revision=2; }
message Capabilities { repeated ReferenceFrame frames=1; uint32 max_objects=2; uint32 max_samples_per_batch=3; repeated Geometry.Shape shapes=4; bool catalog_available=5; uint32 max_model_bytes=6; uint32 max_layers=7; uint32 max_layer_input_points=8; }
service SceneService {
  rpc GetScene(Empty) returns (Scene);
  rpc GetCapabilities(Empty) returns (Capabilities);
  rpc CreateObject(CreateObjectRequest) returns (Applied);
  rpc RemoveObject(ObjectRequest) returns (Applied);
  rpc SetVisibility(VisibilityRequest) returns (Applied);
  rpc PushStates(StateBatch) returns (Applied);
  // Backpressure: up to 32 pending batches per stream, with a bounded global
  // queue. Summary counts applied batches. Rendering uses time interpolation
  // and holds the last state after stream loss.
  rpc StreamStates(stream StateBatch) returns (StreamSummary);
}
service CameraService {
  // Tracking keeps manual orbit and zoom available. Reserved context IDs:
  // @earth-moon, @inner-system and @system. Removing an external target focuses Earth.
  rpc Focus(FocusRequest) returns (Applied);
  // The next frame after it is applied is saved as PNG under the capture directory.
  rpc Capture(CaptureRequest) returns (Applied);
  rpc Orbit(OrbitRequest) returns (Applied);
  rpc GetCamera(Empty) returns (Camera);
}

service TimeService {
  // Same immutable frame snapshot as GetScene. No OS clock modification.
  rpc GetTime(Empty) returns (ClockStatus);
  // Simulated date from 1900-01-01 to 2100-12-31 UTC, |rate| up to 7 days per
  // second. External objects are evaluated at the simulated instant, so states
  // must be timestamped in simulated time to follow it.
  rpc SetTime(SetTimeRequest) returns (Applied);
}

message CatalogQuery { string query=1; }
message CatalogItem {
  string id=1; string name=2; string provider=3;
  double reference_radius_meters=4; bool present_in_scene=5;
  string representation=6;
}
message CatalogList { repeated CatalogItem items=1; }
message ImportCatalogObjectRequest {
  string catalog_id=1; string object_id=2;
  bool focus_camera=3; optional uint32 color_rgb=4;
}
message CatalogJob {
  enum Stage { QUEUED=0; LOADING=1; APPLYING=2; TRACKING=3; DEGRADED=4; FAILED=5; REMOVED=6; }
  uint64 id=1; string catalog_id=2; string object_id=3; Stage stage=4;
  string error=5; double fetched_utc_unix_seconds=6;
  double valid_until_utc_unix_seconds=7; uint64 applied_revision=8;
}
message CatalogJobRequest { uint64 id=1; }
message CatalogJobs { repeated CatalogJob jobs=1; }
service CatalogService {
  // First catalog: known Solar System bodies, real Horizons positions and
  // explicit simplified spheres. Detailed bundled bodies are not replaced.
  rpc ListObjects(CatalogQuery) returns (CatalogList);
  // Explicit online SBDB lookup by name/designation; up to 50 matches.
  // Run off the render thread. Unknown diameter is reported as radius 0.
  rpc SearchObjects(CatalogQuery) returns (CatalogList);
  // Returns an asynchronous job; TRACKING confirms owner-thread application.
  // Imported objects are refreshed automatically until removed from the scene.
  rpc ImportObject(ImportCatalogObjectRequest) returns (CatalogJob);
  rpc GetJob(CatalogJobRequest) returns (CatalogJob);
  rpc GetJobs(Empty) returns (CatalogJobs);
  rpc RetryJob(CatalogJobRequest) returns (CatalogJob);
}

message RegisterModelRequest { string id=1; string source=2; bytes glb=3; }
message ModelAsset {
  string id=1; string source=2; uint64 bytes=3;
  uint32 vertices=4; uint32 triangles=5;
  Vector3 size_model_units=6; double radius_model_units=7;
}
message ModelAssets { repeated ModelAsset assets=1; }
service AssetService {
  // Bounded static opaque GLB 2; embedded geometry, local hierarchy and PBR
  // solid materials. Textures, animations, skins and extensions are rejected.
  rpc RegisterModel(RegisterModelRequest) returns (Applied);
  rpc ListModels(Empty) returns (ModelAssets);
  // Remove dependent scene objects first. Asset IDs are immutable while used.
  rpc RemoveModel(ObjectRequest) returns (Applied);
}

message GeographicPoint { double longitude_degrees=1; double latitude_degrees=2; }
message CreateLayerRequest {
  enum Kind { KIND_UNSPECIFIED=0; POINTS=1; POLYLINE=2; }
  enum Frame { FRAME_UNSPECIFIED=0; GEOCENTRIC_ICRF=1; OBJECT_LOCAL=2; EARTH_SURFACE=3; }
  string id=1; string name=2; string source=3; string anchor_id=4;
  Kind kind=5; Frame frame=6;
  repeated Vector3 positions_meters=7; repeated GeographicPoint geographic_points=8;
  optional uint32 color_rgb=9; optional float width_pixels=10;
  // Earth surface only: positive clearance over the displayed terrain.
  optional double clearance_meters=11;
}
message Layer {
  string id=1; string name=2; string source=3; string anchor_id=4;
  CreateLayerRequest.Kind kind=5; CreateLayerRequest.Frame frame=6;
  uint32 point_count=7; uint32 color_rgb=8; float width_pixels=9;
  double clearance_meters=10; bool visible=11;
}
message Layers { repeated Layer layers=1; }
service LayerService {
  rpc CreateLayer(CreateLayerRequest) returns (Applied);
  rpc ListLayers(Empty) returns (Layers);
  rpc SetVisibility(VisibilityRequest) returns (Applied);
  rpc RemoveLayer(ObjectRequest) returns (Applied);
}
// Flight: one 6-DOF vehicle integrated in lockstep by Albert's physics core (docs/PHYSICS.md).
// Commands apply at the current tick; Step then advances `ticks` fixed steps and returns
// the sample at the new tick. Body axes: x forward, y right, z down. The scene shows the
// vehicle as object "flight" and the simulated clock follows the flight while it is not live.
message Geodetic { double latitude_degrees=1; double longitude_degrees=2; double height_meters=3; }
// GENERIC_LANDER: Apollo LM descent-sized single stage on four sprung legs with friction.
// GENERIC_LUNAR_ASCENT: Apollo LM ascent-sized stage (4.85 t, fixed 15.57 kN engine, RCS attitude).
// GENERIC_MARS_ASCENT: two-stage Mars ascent vehicle on the MSR MAV mass budget (~450 kg, liquid).
// SATURN_V: Apollo 11's AS-506 from its flight evaluation report, as five stages (S-IC; S-II with the aft interstage and
// the escape tower, with the tower, alone; S-IVB): separate jettisons each; attitude by ideal torque (1e10 N m).
// CUSTOM: CreateFlightRequest.definition (any vehicle; FlightService.GetVehicle gives each preset as one, to edit).
enum Vehicle { VEHICLE_UNSPECIFIED=0; GENERIC_LAUNCHER=1; NESC_TWO_STAGE=2; NESC_SPHERE=3; GENERIC_LANDER=4; GENERIC_LUNAR_ASCENT=5; GENERIC_MARS_ASCENT=6; SATURN_V=7; CUSTOM=8; }
// A vehicle in full, as the physics core holds it (docs/PHYSICS.md). SI; positions in metres aft of the nose along body x
// (y right, z down). Stages in firing order, each describing the whole stack while it is the lowest: separating it leaves
// the next. Inertias are principal moments about the centre of mass; full and empty bound the active stage's propellant.
message AeroTable { repeated double mach=1; repeated double angle_degrees=2; repeated double values=3; } // values[m * angles + a]; bilinear, clamped; unset: 0.
// values[(m * angles + a) * deflections + d]; trilinear, clamped; unset: 0.
message SurfaceTable { repeated double mach=1; repeated double angle_degrees=2; repeated double deflection_degrees=3; repeated double values=4; }
// A control surface: deflection limit and actuator rate (rate 0: instant); coefficient increments on the stage's references
// against Mach, the angle of attack (sideslip for side force and yaw) and the deflection. position_meters (x aft of the nose,
// y right, z down), when set: its lift, drag and side force act there, their moment taken from there (else at the stage's
// aerodynamic reference); its moment tables add as they are.
message SurfaceDefinition { string name=1; double limit_radians=2; double rate_radians_per_second=3;
  SurfaceTable lift=4; SurfaceTable drag=5; SurfaceTable side=6; SurfaceTable roll=7; SurfaceTable pitch=8; SurfaceTable yaw=9; Vector3 position_meters=10;
  Vector3 normal=11; } // Set: lift acts along this body direction (a fin's normal force) instead of square to the air in the pitch plane.
// A thermal-protection node (a tile, a panel): heated by the stagnation flux times heating_factor and cos θ to the flow
// (modified Newtonian), radiating to the sky and conducting to its structure; it reports OVERHEAT above limit_kelvin
// (0: never). Unset: emissivity and absorptivity 0.85, structure and start 300 K, factor 1.
message ThermalNodeDefinition { string name=1; Vector3 position_meters=2; Vector3 normal=3; double area_meters2=4; double heat_capacity_joules_per_kelvin=5;
  optional double emissivity=6; optional double absorptivity=7; double conductance_watts_per_kelvin=8; optional double structure_kelvin=9;
  optional double heating_factor=10; optional double start_kelvin=11; double limit_kelvin=12;
  double failure_kelvin=13; } // Past it the vehicle breaks up (0: never; FlightSample.breakup).
// A reaction-control thruster on the stage's propellant; with any, torque_newton_meters fires them.
// min_pulse_seconds: its valve opens and shuts whole, for this long each time (the duty asked met on average, by pulse-width
// modulation, as a real thruster's); 0: its thrust as smooth as the duty. Up to 10 s.
message ThrusterDefinition { string name=1; Vector3 position_meters=2; Vector3 direction=3; double thrust_newtons=4; double exhaust_velocity_meters_per_second=5; double min_pulse_seconds=6; }
message Aerodynamics {
  double reference_area_meters2=1; double reference_length_meters=2; double reference_span_meters=3;
  // Lift and pitch against angle of attack, side force and yaw against sideslip, drag against the total angle, roll against α.
  AeroTable lift=4; AeroTable drag=5; AeroTable side=6; AeroTable roll=7; AeroTable pitch=8; AeroTable yaw=9;
  double roll_damping=10; double pitch_damping=11; double yaw_damping=12; // Per radian of rate × length (span) / 2V.
}
message EngineDefinition {
  string name=1; Vector3 position_meters=2; // The nozzle exit's centre.
  optional Vector3 direction=3;             // Pushing the vehicle toward, at zero gimbal; unset: body x.
  double vacuum_thrust_newtons=4; double exhaust_velocity_meters_per_second=5; double exit_area_meters2=6;
  optional double min_throttle=7;           // Deepest throttle, above 0; unset: 1.
  double gimbal_radians=8; double gimbal_rate_radians_per_second=9; // Rate 0: instant.
  // Air-breathing (a jet): thrust at full throttle and fuel per newton-second against Mach and altitude, none without air;
  // the spool follows the throttle with spool_seconds (0: instant). The rocket fields above (thrust, exhaust, exit area) are unused.
  // A rocket with spool_seconds: its start transient (thrust and flow rise to running with that time constant after ignition).
  bool air_breathing=10; EngineTable thrust_table=11; EngineTable fuel_table=12; double spool_seconds=13;
  double start_kilograms=14;                 // Propellant each ignition costs (spinning the turbopumps up).
  // relight_seconds: how long it stays off before it can start again (chilled and purged; 0: at once); max_starts: the most
  // ignitions it has in a flight (0: any). An ignition it is not ready for leaves it off (EngineSample.ready says).
  double relight_seconds=15; uint32 max_starts=16;
}
message EngineTable { repeated double mach=1; repeated double altitude_km=2; repeated double values=3; } // values[m * altitudes + a]; bilinear, clamped.
// A wheel: contact point, strut stiffness and damping, rolling resistance and braking μ along its heading, cornering μ
// across, steering limit (rad about body z, + right; 0: fixed). Unset: rolling 0.015, braking 0.5, cornering 0.8.
message WheelDefinition { string name=1; Vector3 position_meters=2; double stiffness_newtons_per_meter=3; double damping_newton_seconds_per_meter=4;
  optional double rolling=5; optional double braking=6; optional double cornering=7; double steer_limit_radians=8; }
message StageDefinition {
  string name=1; double propellant_kilograms=2;
  double mass_full_kilograms=3; double mass_empty_kilograms=4; // Empty + propellant = full.
  double cg_full_meters=5; double cg_empty_meters=6;
  Vector3 inertia_full_kilogram_meters2=7; Vector3 inertia_empty_kilogram_meters2=8;
  double length_meters=9; repeated EngineDefinition engines=10; Aerodynamics aerodynamics=11;
  double aerodynamic_reference_meters=12;   // Point the aerodynamic moments are given about.
  optional double nose_radius_meters=13;    // Stagnation heating; unset: 1.
  repeated Vector3 legs_meters=14;          // Contact points on springs and dampers; none: touchdown at the CG.
  double leg_stiffness_newtons_per_meter=15; double leg_damping_newton_seconds_per_meter=16; optional double friction=17; // Unset: 0.6.
  repeated SurfaceDefinition surfaces=18;   // Up to 32.
  repeated ThrusterDefinition thrusters=19; // Up to 64.
  repeated ThermalNodeDefinition thermal_nodes=20; // Up to 256.
  repeated WheelDefinition wheels=21;       // Up to 32.
  repeated Vector3 hard_points_meters=22;   // Points that strike structures (catch pins); up to 32.
  StageAppearance appearance=23;            // How it looks in the scene (unset: a cylinder of the vehicle's diameter).
  // The propellant as cryogens and plumbing hold it: a share of what is left boiled off a day (vented, always); what the
  // engines cannot draw (residuals: they starve at it); the thrusters' own gas (unset: they burn the propellant).
  double boiloff_per_day=24; double residual_kilograms=25; optional double thruster_gas_kilograms=26;
  // header_kilograms: header tanks (the landing's propellant) that hold the last of it, their centre header_meters aft of the
  // nose: once the main tanks are dry what is left sits there (its centre of mass and inertia follow; 0: none).
  double header_kilograms=27; double header_meters=28;
}
// How a stage looks in the scene only (the physics never reads it); positions in metres along the stage as its other parts.
// Its body: frustums along x (a nose as several), each a colour (0xRRGGBB) and an arc of black tiles centred on +z (radians;
// 0: none). Parts on hinges (flaps, fins): a plate from the hinge line (through hinge_meters along axis, span_meters long)
// out along `outward` (width_meters, thickness_meters thick), turned about the axis by gain × the deflection of its surface
// (1-based; 0: fixed) plus offset_radians; grid: a grid fin's lattice, centred on its spindle (the hinge). A plate's outer edge,
// width_meters out: tip_span_meters long along the axis (unset: span_meters), its centre tip_shift_meters along the axis from the
// hinge's (a swept edge), tip_thickness_meters thick (unset: as at the hinge): a trapezoid tapering out, as flaps are. The engines' bells and plumes and the thrusters' jets
// come from their definitions.
message BodySection { double from_meters=1; double to_meters=2; double radius_from_meters=3; double radius_to_meters=4; uint32 color=5; double tiles_radians=6; }
message HingedPart { string name=1; Vector3 hinge_meters=2; Vector3 axis=3; Vector3 outward=4; double span_meters=5; double width_meters=6; double thickness_meters=7;
  uint32 surface=8; double gain=9; double offset_radians=10; uint32 color=11; bool grid=12; optional double tip_span_meters=13; double tip_shift_meters=14;
  optional double tip_thickness_meters=15; }
// A propellant tank's span (m aft of the nose): frosted on the outside below the liquid (filled from its aft end by the stage's
// propellant left, or always when `full`: an upper stage's tanks riding along).
message Tank { double from_meters=1; double to_meters=2; bool full=3; }
message StageAppearance { repeated BodySection sections=1; repeated HingedPart parts=2; repeated Tank tanks=3; } // Up to 64 sections and parts, 8 tanks.
message VehicleDefinition {
  string name=1; repeated StageDefinition stages=2;  // 1-32 stages, up to 64 engines and 32 legs each, tables up to 128 x 128.
  double attitude_torque_newton_meters=3;           // Ideal torque limit per axis (torque_newton_meters).
  optional double diameter_meters=4;                // Shown in the scene; unset: 1.
  double solar_area_meters2=5; optional double reflectivity=6; // Radiation pressure (0 area: none); unset reflectivity 1.3.
  optional bool jet_damping=7; optional double inertia_rate=8; // Exhaust momentum flux and the İω term; unset: on and 1.
  // The hull as a solid (a capsule nose to tail, diameter wide) striking the ground and the structures, breaking up faster than
  // this along the contact's normal; unset: only legs, wheels and hard points touch (FlightSample.breakup).
  optional double crash_speed_meters_per_second=9;
}
message VehicleRequest { Vehicle vehicle=1; optional double payload_kilograms=2; }
message CreateFlightRequest {
  Vehicle vehicle=1;
  optional double payload_kilograms=2;   // GENERIC_LAUNCHER only; default 5000.
  Geodetic site=3;                      // Clamped on the pad; the ground is the site height.
  double heading_degrees=4;             // Body x azimuth, clockwise from north.
  optional double pitch_degrees=5;      // Above the horizon; default 90 (vertical).
  optional double utc_unix_seconds=6;   // Default: the current simulated instant.
  optional double step_seconds=7;       // Default 0.001; 1e-5 to 0.1.
  bool focus_camera=8;
  optional double coast_step_seconds=9; // Longest step while ballistic above the atmosphere (86 km Earth, 150 km Mars); default 1, 0 disables, up to 10.
  // Degree and order: EGM2008 2-70 (default 20); GRAIL GRGM1200A 2-600 and MRO GMM-3 2-120 (default 100), downloaded once;
  // 0: the central body as a point mass.
  optional uint32 gravity_degree=10;
  // AUTOMATIC: live NOAA GFS when Albert follows the real clock and the instant is within
  // 2 h of now, else (or if GFS is unreachable) the 1976 standard atmosphere. Elsewhere only
  // AUTOMATIC or STANDARD_ATMOSPHERE: the Mars mean atmosphere, or vacuum on the Moon.
  enum Weather { WEATHER_AUTOMATIC=0; STANDARD_ATMOSPHERE=1; LIVE_GFS=2; }
  Weather weather=11;
  ImuSettings imu=12;
  // Site height from the measured ground, resolved at creation: Earth Copernicus DEM 30 m +
  // EGM2008 geoid (ellipsoidal); Moon LRO LOLA; Mars MGS MOLA (to ±88°), both ~237 m posts.
  bool terrain_height=13;
  // The pad's clamps hold the vehicle until a release command, however much it pushes (a launch commit by the flight software);
  // unset, they let go once its thrust beats its weight.
  bool hold_down=23;
  // On the pad, the vehicle's base this high over the site's ground (0-100 m; default 0): it stands on a launch mount there,
  // held by its clamps; the ground stays at the site's height.
  optional double deck_height_meters=24;
  // Central body. Coordinates (sites and samples): Earth WGS 84; Moon mean-Earth frame over the
  // 1737.4 km sphere; Mars IAU 2015 frame, east longitude and ellipsoid-normal (planetographic)
  // latitude over the 3396.19 x 3376.20 km ellipsoid. Site heights -10 to 25 km off Earth.
  enum Body { EARTH=0; MOON=1; MARS=2; }
  Body body=14;
  VehicleDefinition definition=15;      // CUSTOM only.
  PhysicsSettings physics=16;           // Unset fields: Albert's defaults (its Física menu; all on unless changed there).
  SensorSettings sensors=17;            // Beyond the IMU; each when enabled.
  // In flight instead of on the pad (site then only gives the ground's height and the weather's place).
  StartState start=18;
  // Several flights fly at once, each by its id (letters, digits, _ and -, up to 32; empty: "flight"); creating an existing
  // one replaces it. The scene shows "flight" as object "flight" and the others as "flight.<id>".
  string flight_id=19;
  // The site's surface is water (sea water) at its height: the stack floats by buoyancy and is dragged by the water (splashdown).
  bool water=20;
  // Structures fixed to the ground (a tower's catch arms): segments with a radius, in metres east, north and up of the site,
  // struck by the stages' hard points.
  repeated StructureDefinition structures=21;
  // The site's scenery (a pad's tower, mount, tanks), drawn only, fixed to the ground with the structures (drawn as steel
  // bars; parts on a hinged one turn with it): up to 2048 parts (merged by colour when drawn). The scene shows them as object "site" ("site.<id>" for the
  // other flights; none without scenery or off the Earth).
  repeated SceneryPart scenery=22;
}
// A piece of scenery in metres east, north and up of the site: its centre and size along its own axes, which are turned by
// heading_degrees (its y toward it, clockwise from north) and tilted by tilt_degrees (its z leaning from up toward its y).
// BOX; CYLINDER: diameters size x by y, size z long, hollow inside inner_diameter_meters; TRUSS: a lattice box of chords
// and braces size z long, its bars bar_meters thick (unset: 8% of its width). structure: n turns it with the n-th structure
// when that is hinged (0: fixed).
message SceneryPart { enum Shape { BOX=0; CYLINDER=1; TRUSS=2; } string name=1; Shape shape=2; Vector3 centre_enu_meters=3; Vector3 size_meters=4;
  double heading_degrees=5; double tilt_degrees=6; uint32 color=7; double inner_diameter_meters=8; double bar_meters=9; uint32 structure=10; }
message StructureDefinition { string name=1; Vector3 start_enu_meters=2; Vector3 end_enu_meters=3; double radius_meters=4;
  optional double stiffness_newtons_per_meter=5; optional double damping_newton_seconds_per_meter=6; optional double friction=7; // Unset: 1e7, 1e5, 0.5.
  // Hinged (with hinge_enu_meters): it turns about hinge_axis (east, north, up; unset: up) through that point by an angle from
  // the pose above (right-handed), commanded by FlightCommand.structure_radians within [min_radians, max_radians] and reached
  // at swing_rate_radians_per_second (0: at once); it starts at start_radians.
  Vector3 hinge_enu_meters=8; Vector3 hinge_axis=9; double swing_rate_radians_per_second=10; double min_radians=11; double max_radians=12; double start_radians=13;
  optional bool drawn=14; } // Drawn as a steel bar with the site's scenery (unset: yes; no when the scenery shows it its own way).
message FlightRequest { string flight_id=1; } // Empty: "flight".
message FlightList { repeated string flight_ids=1; }
message StartState {
  oneof where {
    LocalStart local=1;       // Over the central body: geodetic place, velocity relative to the ground, attitude to the local horizon.
    InertialStart inertial=2; // In the flight's inertial frame (GCRF at the Earth; ICRF axes at the Moon or Mars), from the body's centre.
  }
  uint32 stage=3;                          // The active stage (0: the first).
  optional double propellant_kilograms=4;  // Left in it; unset: full.
}
message LocalStart { Geodetic position=1; Vector3 velocity_ned_meters_per_second=2; double heading_degrees=3; double pitch_degrees=4; double roll_degrees=5;
  Vector3 angular_rate_radians_per_second=6; } // Body rates relative to the ground.
message InertialStart { Vector3 position_meters=1; Vector3 velocity_meters_per_second=2; Quaternion attitude=3; Vector3 angular_rate_radians_per_second=4; } // Body to inertial; body rates.
// Navigation sensors (docs/PHYSICS.md), reproducible from the seed; unset values: the defaults noted.
message SensorSettings { GnssSettings gnss=1; RadarAltimeterSettings radar_altimeter=2; StarTrackerSettings star_tracker=3; uint64 seed=4;
  PropellantGaugeSettings propellant_gauge=5; }
// White noise 1.5 m horizontal, 3 m vertical, 0.05 m/s; Gauss-Markov drift 1 m over 300 s; 10 Hz; below 3000 km, no speed
// limit (a space receiver; 18000 m and 515 m/s make a civil one). Earth flights only.
message GnssSettings { bool enabled=1; optional double horizontal_sigma_meters=2; optional double vertical_sigma_meters=3;
  optional double velocity_sigma_meters_per_second=4; optional double drift_sigma_meters=5; optional double drift_correlation_seconds=6;
  optional double period_seconds=7; optional double max_height_meters=8; optional double max_speed_meters_per_second=9;
  // RTK with a base station at the site (unset range: none): within the range, σ 0.02 m + 1 ppm of the range a axis and
  // 0.02 m/s, the fix lost with probability 0.02 + (range / max)² (then the plain one). The plasma sheath's blackout above
  // the heat flux (W/m²; unset: none).
  optional double rtk_range_meters=10; optional double rtk_sigma_meters=11; optional double rtk_ppm=12;
  optional double rtk_velocity_sigma_meters_per_second=13; optional double rtk_dropout=14; optional double blackout_heat_flux_watts_per_meter2=15; }
// The tanks' level sensors: σ 0.5% of what is left + 300 kg, a 0.3% bias drawn once; 10 Hz.
message PropellantGaugeSettings { bool enabled=1; optional double sigma_fraction=2; optional double floor_kilograms=3; optional double bias_fraction=4; optional double period_seconds=5; }
// Slant range along the boresight (body; +z, down by default) to the ground, within 20° of the vertical and 2500 m; noise
// max(0.3 m, 1% of the range); 20 Hz.
message RadarAltimeterSettings { bool enabled=1; optional Vector3 boresight=2; optional double half_angle_radians=3; optional double max_range_meters=4;
  optional double noise_floor_meters=5; optional double noise_fraction=6; optional double period_seconds=7; }
// Attitude (body to inertial) with 5″ across the boresight (body; -z, up by default) and 40″ about it; none within 30° of
// the Sun, within the central body's disc plus 10°, or above 2°/s; 10 Hz.
message StarTrackerSettings { bool enabled=1; optional Vector3 boresight=2; optional double cross_sigma_radians=3; optional double roll_sigma_radians=4;
  optional double sun_exclusion_radians=5; optional double body_margin_radians=6; optional double max_rate_radians_per_second=7; optional double period_seconds=8; }
// The physics models a flight runs (docs/PHYSICS.md); each switch off removes that model. The flight's sample and its log
// carry them resolved, so a replay does not depend on Albert's defaults.
message PhysicsSettings {
  optional bool third_bodies=1;             // Tides of the Sun and Moon (the Earth and Sun at the Moon; the Sun at Mars).
  optional bool relativity=2;               // Schwarzschild term of the central body.
  optional bool atmosphere=3;               // Air: drag, lift, heating and back pressure on nozzles (off: vacuum).
  optional bool wind=4;                     // The weather's wind (off: air at rest with the ground).
  optional bool solar_radiation_pressure=5; // On the vehicle's solar area.
  // Dryden turbulence (MIL-F-8785C): the vertical gust's intensity σ (m/s; 0 or unset: none; about 1 light, 2-3 moderate,
  // 5 or more severe), with the low-altitude scale lengths and intensities by height; reproducible from the seed.
  optional double turbulence_meters_per_second=6; uint64 turbulence_seed=7;
}
// Inertial measurement unit and barometer errors (IEEE 952 terms, representative grades);
// the seed makes the noise reproducible.
// count: redundant units (1-3, unset 1), each with its own errors (FlightSample.imus); NAVIGATION: a launch vehicle's grade.
message ImuSettings { enum Grade { IDEAL=0; TACTICAL=1; INDUSTRIAL=2; NAVIGATION=3; } Grade grade=1; uint64 seed=2; uint32 count=3; }
message Gimbal { double pitch_radians=1; double yaw_radians=2; } // + pitch: nose up; + yaw: nose right.
message FlightCommand {
  oneof command {
    bool ignite=1; bool cutoff=2; bool separate=3; bool release=4;
    double throttle=5;                  // Clamped to each engine's deepest throttle and 1.
    Gimbal gimbal=6;                    // Clamped to each engine's limit; reached at its actuators' rate.
    Vector3 torque_newton_meters=7;     // Ideal attitude torque, body axes, clamped per axis.
    bool fail=8;                        // The engine fails: off, and refuses to ignite (needs an engine).
    double thruster_duty=10;            // A thruster's duty cycle, 0-1, until the next torque command.
    double surface_radians=11;          // A control surface's deflection command, clamped to its limit, reached at its rate.
    Spawn spawn=12;                     // Separate the active stage as a flight of its own (gRPC only).
    double brake=13;                    // Wheel brakes, 0-1 (index: the wheel).
    double steer_radians=14;            // Wheel steering, clamped to its limit (index: the wheel).
    double structure_radians=15;        // A hinged structure's angle, clamped to its range, reached at its rate (index: the structure).
    // Interference (a test's or the operator's), until changed: wind added to the weather's at the vehicle (NED, m/s; in air
    // only); an outside force on it (NED, N, at its centre of mass).
    Vector3 gust_ned_meters_per_second=16; Vector3 force_ned_newtons=17;
    SensorFault sensor_fault=18;        // A sensor made to fail or lie.
    bool fail_silent=19;                // The engine fails but reports itself healthy, lit as commanded (its thrust reads true).
    bool terminate=20;                  // The flight termination system: it breaks up (Breakup.TERMINATED).
    string uplink=21;                   // A message for the flight software (up to 64 characters), in the next sample's uplinks.
    // An actuator jammed where it is from now on (its position reads true, its command as given): the engine's gimbal, the
    // surface.
    bool stick_gimbal=22; bool stick_surface=23;
    double vent_kilograms_per_second=24; // The main tanks vented at that rate (0: shut), down to the header tanks' load or the residuals.
  }
  // ignite, cutoff, throttle, gimbal, fail, fail_silent and stick_gimbal: the engine; thruster_duty: the thruster; surface_radians, stick_surface: the surface; brake, steer: the wheel;
  // structure_radians: the structure. 0 for every one of the stage (the hinged structures), n for its n-th (the order of
  // FlightSample.engines, thruster_duty, surfaces and CreateFlightRequest.structures).
  uint32 index=9;
}
// A sensor made to fail or lie from now on (NONE: honest again): DEAD (no reading: invalid; an IMU unit's outputs zero and
// valid false), STUCK (its last reading repeated), BIAS (`value` added), DRIFT (an offset growing at `value` a second), NOISE
// (white noise of σ value.x added). value: body m/s² (accelerometer) or rad/s (gyroscope); NED m (GNSS position); m (radar,
// x); body rotation vector, rad (star tracker); kg (gauge, x). unit: which IMU (ImuSettings.count).
message SensorFault { enum Sensor { ACCELEROMETER=0; GYROSCOPE=1; GNSS=2; RADAR_ALTIMETER=3; STAR_TRACKER=4; PROPELLANT_GAUGE=5; }
  enum Mode { NONE=0; DEAD=1; STUCK=2; BIAS=3; DRIFT=4; NOISE=5; }
  Sensor sensor=1; Mode mode=2; Vector3 value=3; uint32 unit=4; }
// Separates the active stage, which flies on as flight `flight_id` (another id): `definition` (its stage 0 the part that fell
// off), its nose `nose_offset_meters` aft of this vehicle's nose, from this flight's state at that instant (the velocity plus
// ω × r, the same attitude and rate), with the propellant left (up to its stage's), the same air, gravity, physics and
// sensors (reseeded). It starts at the instant of the command and steps on its own; its log replays alone.
message Spawn { string flight_id=1; VehicleDefinition definition=2; double nose_offset_meters=3; }
// Up to 600000 ticks. milestones: the mission's events for the broadcast's timeline (up to 64 a flight; a done one replaces
// the planned one of its name), shown with every flight's.
// clock_zero: the mission's T-0 (UTC, Unix seconds) for the broadcast's clock, as the flight software counts it (moved on
// through a hold, the liftoff's once it lifts off); unset: the main flight's start. stop_clock: the clock stops at this
// step's start (a scrub, a pad abort); it stops too once the flight breaks up. decision: the latest decision its flight
// software took, at this step's start, for the broadcast's corner (the newest of every flight's shown).
message StepRequest { repeated FlightCommand commands=1; uint32 ticks=2; string flight_id=3; repeated Milestone milestones=4; optional double clock_zero_utc_unix_seconds=5; bool stop_clock=6; optional Decision decision=7; optional string count_state=8; } // Keep the count visible: HOLD, SCRUB, or empty to clear; unset keeps the last value.
// What a flight software decided and why (up to 120 characters each): "captura cancelada", "propelante insuficiente para
// terminar a captura".
message Decision { string what=1; string why=2; }
// An event of the mission (up to 40 characters: "MAX-Q", "MECO"...): when it happened (unset: at the step's start) or is
// planned (UTC, Unix seconds).
message Milestone { string name=1; optional double utc_unix_seconds=2; bool planned=3; }
message FlightEvent {
  // LIFTOFF: clamp release or the last contact (leg, wheel, water, structure) ending; TOUCHDOWN: CG stop or a first contact.
  // OVERHEAT: a thermal node above its limit (index: the node, FlightSample.thermal_nodes order).
  // BREAKUP: the vehicle broke up (FlightSample.breakup; index: its cause).
  enum Kind { KIND_UNSPECIFIED=0; LIFTOFF=1; DEPLETED=2; TOUCHDOWN=3; OVERHEAT=4; BREAKUP=5; }
  Kind kind=1; double elapsed_seconds=2; uint32 stage=3; uint32 index=4;
}
// Why and when a vehicle broke up: its hull struck the ground or a structure (at that speed along the contact's normal, m/s)
// or a thermal node passed its failure temperature.
message Breakup { enum Cause { NONE=0; GROUND=1; STRUCTURE=2; HEAT=3; TERMINATED=4; } Cause cause=1; double elapsed_seconds=2; double speed_meters_per_second=3; }
message FlightSample {
  uint64 tick=1; double elapsed_seconds=2; double utc_unix_seconds=3;
  // Ideal sensors at the centre of mass: IMU specific force (zero in free fall) and
  // angular rate relative to inertial space, static pressure and air temperature.
  Vector3 specific_force_meters_per_second2=4; Vector3 angular_rate_radians_per_second=5;
  double static_pressure_pascals=6; double air_temperature_kelvin=7;
  // Truth.
  Vector3 position_meters=8; Vector3 velocity_meters_per_second=9; Quaternion attitude=10; // GCRF; body to GCRF.
  Vector3 position_ecef_meters=11; Vector3 velocity_ecef_meters_per_second=12; Geodetic geodetic=13;
  Vector3 velocity_ned_meters_per_second=14; Quaternion attitude_ned=15; // Relative to the ground; body to NED.
  double mach=16; double dynamic_pressure_pascals=17; double alpha_radians=18; double beta_radians=19; double air_density_kilograms_per_meter3=20;
  uint32 stage=21; uint32 stages=22; double propellant_kilograms=23; double mass_kilograms=24; double thrust_newtons=25;
  bool burning=26; bool clamped=27; bool landed=28; double throttle=29; Gimbal gimbal=30;
  repeated FlightEvent events=31;       // Since the previous Step.
  uint64 state_hash=32;                 // Same commands and steps reproduce it.
  string vehicle=33; double step_seconds=34;
  string atmosphere=35; Vector3 wind_ned_meters_per_second=36; // Source of air data; wind toward NED at the vehicle.
  // Measured by the configured IMU over the last Step (body axes): mean specific force and
  // rate, velocity and angle increments; static pressure with barometer errors. Equal to the
  // ideal values for IDEAL.
  Vector3 measured_specific_force_meters_per_second2=37; Vector3 measured_angular_rate_radians_per_second=38;
  Vector3 delta_velocity_meters_per_second=39; Vector3 delta_angle_radians=40; double measured_static_pressure_pascals=41;
  uint32 data_port=42; // Binary lockstep data plane on 127.0.0.1 (src/rpc/flight_wire.hpp).
  bool leg_contact=43; // In contact: a leg or wheel on the ground, a slice in the water or a hard point on a structure (landed: stopped at the CG, vehicles without them).
  // Convective stagnation-point heating (Sutton-Graves, stage nose radius) and its integral.
  double heat_flux_watts_per_meter2=44; double heat_load_joules_per_meter2=45;
  repeated EngineSample engines=46;     // The stage's engines (thrust, throttle and gimbal above are the totals and the last commands to all).
  repeated SurfaceSample surfaces=47;   // The stage's control surfaces.
  repeated double thruster_duty=48;     // The stage's thrusters' duty cycles (from the torque command or set directly).
  Vector3 thruster_force_newtons=49; Vector3 thruster_moment_newton_meters=50; // Theirs, body axes, about the CG.
  PhysicsSettings physics=51;           // The models this flight runs, resolved.
  // The latest measurement of each enabled sensor (valid false: none possible then), timed in elapsed seconds.
  GnssReading gnss=52; RadarAltimeterReading radar_altimeter=53; StarTrackerReading star_tracker=54;
  string flight_id=55;
  repeated ThermalSample thermal_nodes=56; // The stage's thermal nodes now.
  repeated WheelSample wheels=57;           // The stage's wheels.
  Vector3 contact_force_newtons=58;         // From the ground, water and structures, body axes.
  repeated double structure_radians=59;     // Each structure's angle about its hinge (0 when fixed), in the request's order.
  Breakup breakup=60;                       // Unset cause: whole. Once broken up the engines are out and commands do nothing.
  double thruster_gas_kilograms=61;         // The thrusters' own gas left (with StageDefinition.thruster_gas_kilograms).
  PropellantGaugeReading propellant_gauge=62; // With SensorSettings.propellant_gauge.
  repeated ImuReading imus=63;              // Each IMU unit over the last Step (the first as fields 37-40).
  repeated string uplinks=64;               // Messages for the flight software since the last Step (FlightCommand.uplink).
}
message ImuReading { Vector3 specific_force_meters_per_second2=1; Vector3 angular_rate_radians_per_second=2; Vector3 delta_velocity_meters_per_second=3;
  Vector3 delta_angle_radians=4; bool valid=5; }
message PropellantGaugeReading { bool valid=1; double elapsed_seconds=2; double propellant_kilograms=3; }
message WheelSample { string name=1; double brake=2; double steer_radians=3; }
message ThermalSample { string name=1; double temperature_kelvin=2; double heat_flux_watts_per_meter2=3; bool over_limit=4; }
message GnssReading { bool valid=1; double elapsed_seconds=2; Vector3 position_ecef_meters=3; Vector3 velocity_ecef_meters_per_second=4; bool rtk=5; } // rtk: corrected by the site's base.
message RadarAltimeterReading { bool valid=1; double elapsed_seconds=2; double range_meters=3; }
message StarTrackerReading { bool valid=1; double elapsed_seconds=2; Quaternion attitude=3; }
message SurfaceSample { string name=1; double deflection_radians=2; double command_radians=3; }
// One engine now: gimbal as moved (rate-limited toward its command); thrust after the ambient pressure.
message EngineSample { string name=1; bool on=2; bool failed=3; double throttle=4; Gimbal gimbal=5; Gimbal gimbal_command=6; double thrust_newtons=7; double spool=8; bool ready=9; } // spool: a jet's, 0-1. ready: could be lit now.
// Replay: the creation request (instant resolved), the air inputs (GFS GRIB2 of both hours,
// space-weather days) and every step with its commands in order. Replaying needs no network
// and ends with the same state_hash.
message SpaceWeatherDay { double day=1; double f107=2; double f107a=3; double ap_average=4; repeated double ap=5; string type=6; }
message FlightLog {
  string engine=1; CreateFlightRequest request=2; repeated bytes gfs=3; repeated SpaceWeatherDay space_weather=4;
  bytes steps=5; uint64 state_hash=6; uint64 tick=7; string atmosphere=8;
  bytes gravity=9; // Moon or Mars: the PDS table excerpt up to the flight's degree.
  repeated Spawn spawns=10; // The spawn commands' payloads, in order (a replay creates the spawned flights again).
}
message FlightLogChunk { bytes data=1; } // A serialised FlightLog in pieces of up to 1 MiB.
// Real time: Albert advances the flight on the wall clock (rate × real time) and pushes one
// sample every sample_every_ticks over the data plane, describing the flight sensor_delay_ticks
// earlier. Command frames (ticks ignored, no reply) take effect actuator_delay_ticks after they
// arrive. Without commands for command_timeout_seconds the missing-command policy applies once.
// Step is refused meanwhile; steps stay in the replay log.
message RealtimeRequest {
  double rate=1; uint32 sensor_delay_ticks=2; uint32 actuator_delay_ticks=3; double command_timeout_seconds=4;
  enum Missing { HOLD=0; NEUTRAL=1; CUTOFF=2; } // NEUTRAL: gimbal and torque to zero; CUTOFF: engine off.
  Missing missing=5; uint32 sample_every_ticks=6;  // Defaults: rate 1, every 10 ticks.
  string flight_id=7;
}
message RealtimeStatus { bool running=1; uint64 tick=2; uint64 late_ticks=3; double worst_lag_seconds=4; uint64 policy_events=5; }
service FlightService {
  rpc CreateFlight(CreateFlightRequest) returns (FlightSample); // Replaces any current flight.
  rpc GetVehicle(VehicleRequest) returns (VehicleDefinition);   // A preset as a definition (to fly as CUSTOM, edited or not).
  rpc Step(StepRequest) returns (FlightSample);
  rpc GetFlight(FlightRequest) returns (FlightSample);
  rpc EndFlight(FlightRequest) returns (Applied);               // Removes the vehicle from the scene.
  rpc ListFlights(Empty) returns (FlightList);
  rpc ExportFlight(FlightRequest) returns (stream FlightLogChunk);
  rpc ReplayFlight(stream FlightLogChunk) returns (FlightSample); // Becomes the current flight.
  rpc StartRealtime(RealtimeRequest) returns (RealtimeStatus);
  rpc StopRealtime(FlightRequest) returns (RealtimeStatus);
}
