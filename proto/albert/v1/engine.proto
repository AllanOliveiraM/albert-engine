syntax = "proto3";
package albert.v1;
// All physical quantities use SI. Positions/velocities are geocentric ICRF.
// UTC timestamps are Unix seconds, not arrival times. Quaternion XYZW rotates
// model-local axes into ICRF. No implicit frame conversions are performed.
message Empty {}
message Vector3 { double x=1; double y=2; double z=3; }
message Quaternion { double x=1; double y=2; double z=3; double w=4; }
enum ReferenceFrame { REFERENCE_FRAME_UNSPECIFIED=0; GEOCENTRIC_ICRF=1; }
message State {
  double utc_unix_seconds=1;
  Vector3 position_meters=2;
  optional Vector3 velocity_meters_per_second=3;
  optional Quaternion attitude=4;
  ReferenceFrame frame=5;
}
message Geometry {
  enum Shape { SHAPE_UNSPECIFIED=0; SPHERE=1; BOX=2; CYLINDER=3; MODEL=4; }
  Shape shape=1;
  // Full diameters/extents along local X,Y,Z. Cylinder axis is local Y.
  Vector3 size_meters=2;
  optional uint32 color_rgb=3;
  // MODEL uses a registered GLB asset; its own colors and local origin.
  string model_id=4; optional double meters_per_model_unit=5;
}
message Object {
  string id=1; string name=2; string source=3;
  Geometry geometry=4; State state=5;
  bool builtin=6; bool visible=7; bool stale=8;
  double radius_meters=9;
  bool provider_managed=10;
}
message CreateObjectRequest { string id=1; string name=2; string source=3; Geometry geometry=4; State initial_state=5; }
message ObjectRequest { string id=1; }
message VisibilityRequest { string id=1; bool visible=2; }
// Up to 256 strictly increasing samples. Previously accepted timestamps must
// not be repeated. A rejected batch never partially changes an object's state.
message StateBatch { string id=1; repeated State samples=2; }
// This acknowledges application on the owner thread, not just enqueueing.
message Applied { uint64 revision=1; }
message Camera { string target_id=1; Vector3 position_meters=2; double distance_meters=3; bool transitioning=4; }
message ClockStatus {
  enum Quality { LOCAL=0; SYNCHRONIZED=1; HOLDOVER=2; EXPIRED=3; }
  Quality quality=1; double utc_unix_seconds=2;
  // Negative means unknown (local fallback); estimates are not hard bounds.
  double uncertainty_seconds=3; double last_sync_utc_unix_seconds=4;
  double age_seconds=5; double round_trip_seconds=6;
  string source=7; bool authenticated=8; bool synchronizing=9;
  string error=10; uint64 generation=11; double pending_correction_seconds=12;
  // Instant of the scene states: equals utc_unix_seconds while live.
  SimulationTime simulation=13;
}
// rate: simulated seconds per second (0 paused, negative backwards). limited: held
// at the first or last supported instant. generation changes on date jumps and on
// returning to live time, not on rate changes.
// approximate_positions: the Sun, Moon and planets come from analytic models (ERFA)
// while JPL tables for the instant load or are unavailable.
message SimulationTime { double utc_unix_seconds=1; double rate=2; bool live=3; bool limited=4; uint64 generation=5; bool approximate_positions=6; }
// Unset fields keep their value; live=true ignores both and follows the real clock.
message SetTimeRequest { optional double utc_unix_seconds=1; optional double rate=2; bool live=3; }
// utc_unix_seconds is the simulated instant of the object states (see ClockStatus.simulation).
message Scene { uint64 revision=1; double utc_unix_seconds=2; repeated Object objects=3; Camera camera=4; ClockStatus clock=5; }
message FocusRequest { string id=1; bool reset_zoom=2; }
message OrbitRequest { double azimuth_radians=1; double elevation_radians=2; optional double distance_scale=3; }
message StreamSummary { uint64 applied_batches=1; uint64 revision=2; }
message Capabilities { repeated ReferenceFrame frames=1; uint32 max_objects=2; uint32 max_samples_per_batch=3; repeated Geometry.Shape shapes=4; bool catalog_available=5; uint32 max_model_bytes=6; uint32 max_layers=7; uint32 max_layer_input_points=8; }
service SceneService {
  rpc GetScene(Empty) returns (Scene);
  rpc GetCapabilities(Empty) returns (Capabilities);
  rpc CreateObject(CreateObjectRequest) returns (Applied);
  rpc RemoveObject(ObjectRequest) returns (Applied);
  rpc SetVisibility(VisibilityRequest) returns (Applied);
  rpc PushStates(StateBatch) returns (Applied);
  // Backpressure: up to 32 pending batches per stream, with a bounded global
  // queue. Summary counts applied batches. Rendering uses time interpolation
  // and holds the last state after stream loss.
  rpc StreamStates(stream StateBatch) returns (StreamSummary);
}
service CameraService {
  // Tracking keeps manual orbit and zoom available. Reserved context IDs:
  // @earth-moon, @inner-system and @system. Removing an external target focuses Earth.
  rpc Focus(FocusRequest) returns (Applied);
  rpc Orbit(OrbitRequest) returns (Applied);
  rpc GetCamera(Empty) returns (Camera);
}

service TimeService {
  // Same immutable frame snapshot as GetScene. No OS clock modification.
  rpc GetTime(Empty) returns (ClockStatus);
  // Simulated date from 1900-01-01 to 2100-12-31 UTC, |rate| up to 7 days per
  // second. External objects are evaluated at the simulated instant, so states
  // must be timestamped in simulated time to follow it.
  rpc SetTime(SetTimeRequest) returns (Applied);
}

message CatalogQuery { string query=1; }
message CatalogItem {
  string id=1; string name=2; string provider=3;
  double reference_radius_meters=4; bool present_in_scene=5;
  string representation=6;
}
message CatalogList { repeated CatalogItem items=1; }
message ImportCatalogObjectRequest {
  string catalog_id=1; string object_id=2;
  bool focus_camera=3; optional uint32 color_rgb=4;
}
message CatalogJob {
  enum Stage { QUEUED=0; LOADING=1; APPLYING=2; TRACKING=3; DEGRADED=4; FAILED=5; REMOVED=6; }
  uint64 id=1; string catalog_id=2; string object_id=3; Stage stage=4;
  string error=5; double fetched_utc_unix_seconds=6;
  double valid_until_utc_unix_seconds=7; uint64 applied_revision=8;
}
message CatalogJobRequest { uint64 id=1; }
message CatalogJobs { repeated CatalogJob jobs=1; }
service CatalogService {
  // First catalog: known Solar System bodies, real Horizons positions and
  // explicit simplified spheres. Detailed bundled bodies are not replaced.
  rpc ListObjects(CatalogQuery) returns (CatalogList);
  // Explicit online SBDB lookup by name/designation; up to 50 matches.
  // Run off the render thread. Unknown diameter is reported as radius 0.
  rpc SearchObjects(CatalogQuery) returns (CatalogList);
  // Returns an asynchronous job; TRACKING confirms owner-thread application.
  // Imported objects are refreshed automatically until removed from the scene.
  rpc ImportObject(ImportCatalogObjectRequest) returns (CatalogJob);
  rpc GetJob(CatalogJobRequest) returns (CatalogJob);
  rpc GetJobs(Empty) returns (CatalogJobs);
  rpc RetryJob(CatalogJobRequest) returns (CatalogJob);
}

message RegisterModelRequest { string id=1; string source=2; bytes glb=3; }
message ModelAsset {
  string id=1; string source=2; uint64 bytes=3;
  uint32 vertices=4; uint32 triangles=5;
  Vector3 size_model_units=6; double radius_model_units=7;
}
message ModelAssets { repeated ModelAsset assets=1; }
service AssetService {
  // Bounded static opaque GLB 2; embedded geometry, local hierarchy and PBR
  // solid materials. Textures, animations, skins and extensions are rejected.
  rpc RegisterModel(RegisterModelRequest) returns (Applied);
  rpc ListModels(Empty) returns (ModelAssets);
  // Remove dependent scene objects first. Asset IDs are immutable while used.
  rpc RemoveModel(ObjectRequest) returns (Applied);
}

message GeographicPoint { double longitude_degrees=1; double latitude_degrees=2; }
message CreateLayerRequest {
  enum Kind { KIND_UNSPECIFIED=0; POINTS=1; POLYLINE=2; }
  enum Frame { FRAME_UNSPECIFIED=0; GEOCENTRIC_ICRF=1; OBJECT_LOCAL=2; EARTH_SURFACE=3; }
  string id=1; string name=2; string source=3; string anchor_id=4;
  Kind kind=5; Frame frame=6;
  repeated Vector3 positions_meters=7; repeated GeographicPoint geographic_points=8;
  optional uint32 color_rgb=9; optional float width_pixels=10;
  // Earth surface only: positive clearance over the displayed terrain.
  optional double clearance_meters=11;
}
message Layer {
  string id=1; string name=2; string source=3; string anchor_id=4;
  CreateLayerRequest.Kind kind=5; CreateLayerRequest.Frame frame=6;
  uint32 point_count=7; uint32 color_rgb=8; float width_pixels=9;
  double clearance_meters=10; bool visible=11;
}
message Layers { repeated Layer layers=1; }
service LayerService {
  rpc CreateLayer(CreateLayerRequest) returns (Applied);
  rpc ListLayers(Empty) returns (Layers);
  rpc SetVisibility(VisibilityRequest) returns (Applied);
  rpc RemoveLayer(ObjectRequest) returns (Applied);
}
// Flight: one 6-DOF vehicle integrated in lockstep by Albert's physics core (docs/PHYSICS.md).
// Commands apply at the current tick; Step then advances `ticks` fixed steps and returns
// the sample at the new tick. Body axes: x forward, y right, z down. The scene shows the
// vehicle as object "flight" and the simulated clock follows the flight while it is not live.
message Geodetic { double latitude_degrees=1; double longitude_degrees=2; double height_meters=3; }
enum Vehicle { VEHICLE_UNSPECIFIED=0; GENERIC_LAUNCHER=1; NESC_TWO_STAGE=2; NESC_SPHERE=3; }
message CreateFlightRequest {
  Vehicle vehicle=1;
  optional double payload_kilograms=2;   // GENERIC_LAUNCHER only; default 5000.
  Geodetic site=3;                      // Clamped on the pad; the ground is the site height.
  double heading_degrees=4;             // Body x azimuth, clockwise from north.
  optional double pitch_degrees=5;      // Above the horizon; default 90 (vertical).
  optional double utc_unix_seconds=6;   // Default: the current simulated instant.
  optional double step_seconds=7;       // Default 0.001; 1e-5 to 0.1.
  bool focus_camera=8;
  optional double coast_step_seconds=9; // Longest step while ballistic above 86 km; default 1, 0 disables, up to 10.
  optional uint32 gravity_degree=10;     // EGM2008 degree and order, 2 to 70; default 20.
  // AUTOMATIC: live NOAA GFS when Albert follows the real clock and the instant is within
  // 2 h of now, else (or if GFS is unreachable) the 1976 standard atmosphere.
  enum Weather { WEATHER_AUTOMATIC=0; STANDARD_ATMOSPHERE=1; LIVE_GFS=2; }
  Weather weather=11;
  ImuSettings imu=12;
}
// Inertial measurement unit and barometer errors (IEEE 952 terms, representative grades);
// the seed makes the noise reproducible.
message ImuSettings { enum Grade { IDEAL=0; TACTICAL=1; INDUSTRIAL=2; } Grade grade=1; uint64 seed=2; }
message Gimbal { double pitch_radians=1; double yaw_radians=2; } // + pitch: nose up; + yaw: nose right.
message FlightCommand {
  oneof command {
    bool ignite=1; bool cutoff=2; bool separate=3; bool release=4;
    double throttle=5;                  // Clamped to the stage's deepest throttle and 1.
    Gimbal gimbal=6;                    // Clamped to the stage's limit.
    Vector3 torque_newton_meters=7;     // Ideal attitude torque, body axes, clamped per axis.
  }
}
message StepRequest { repeated FlightCommand commands=1; uint32 ticks=2; } // Up to 600000 ticks.
message FlightEvent {
  enum Kind { KIND_UNSPECIFIED=0; LIFTOFF=1; DEPLETED=2; TOUCHDOWN=3; }
  Kind kind=1; double elapsed_seconds=2; uint32 stage=3;
}
message FlightSample {
  uint64 tick=1; double elapsed_seconds=2; double utc_unix_seconds=3;
  // Ideal sensors at the centre of mass: IMU specific force (zero in free fall) and
  // angular rate relative to inertial space, static pressure and air temperature.
  Vector3 specific_force_meters_per_second2=4; Vector3 angular_rate_radians_per_second=5;
  double static_pressure_pascals=6; double air_temperature_kelvin=7;
  // Truth.
  Vector3 position_meters=8; Vector3 velocity_meters_per_second=9; Quaternion attitude=10; // GCRF; body to GCRF.
  Vector3 position_ecef_meters=11; Vector3 velocity_ecef_meters_per_second=12; Geodetic geodetic=13;
  Vector3 velocity_ned_meters_per_second=14; Quaternion attitude_ned=15; // Relative to the ground; body to NED.
  double mach=16; double dynamic_pressure_pascals=17; double alpha_radians=18; double beta_radians=19; double air_density_kilograms_per_meter3=20;
  uint32 stage=21; uint32 stages=22; double propellant_kilograms=23; double mass_kilograms=24; double thrust_newtons=25;
  bool burning=26; bool clamped=27; bool landed=28; double throttle=29; Gimbal gimbal=30;
  repeated FlightEvent events=31;       // Since the previous Step.
  uint64 state_hash=32;                 // Same commands and steps reproduce it.
  string vehicle=33; double step_seconds=34;
  string atmosphere=35; Vector3 wind_ned_meters_per_second=36; // Source of air data; wind toward NED at the vehicle.
  // Measured by the configured IMU over the last Step (body axes): mean specific force and
  // rate, velocity and angle increments; static pressure with barometer errors. Equal to the
  // ideal values for IDEAL.
  Vector3 measured_specific_force_meters_per_second2=37; Vector3 measured_angular_rate_radians_per_second=38;
  Vector3 delta_velocity_meters_per_second=39; Vector3 delta_angle_radians=40; double measured_static_pressure_pascals=41;
  uint32 data_port=42; // Binary lockstep data plane on 127.0.0.1 (src/rpc/flight_wire.hpp).
}
// Replay: the creation request (instant resolved), the air inputs (GFS GRIB2 of both hours,
// space-weather days) and every step with its commands in order. Replaying needs no network
// and ends with the same state_hash.
message SpaceWeatherDay { double day=1; double f107=2; double f107a=3; double ap_average=4; repeated double ap=5; string type=6; }
message FlightLog {
  string engine=1; CreateFlightRequest request=2; repeated bytes gfs=3; repeated SpaceWeatherDay space_weather=4;
  bytes steps=5; uint64 state_hash=6; uint64 tick=7; string atmosphere=8;
}
message FlightLogChunk { bytes data=1; } // A serialised FlightLog in pieces of up to 1 MiB.
// Real time: Albert advances the flight on the wall clock (rate × real time) and pushes one
// sample every sample_every_ticks over the data plane, describing the flight sensor_delay_ticks
// earlier. Command frames (ticks ignored, no reply) take effect actuator_delay_ticks after they
// arrive. Without commands for command_timeout_seconds the missing-command policy applies once.
// Step is refused meanwhile; steps stay in the replay log.
message RealtimeRequest {
  double rate=1; uint32 sensor_delay_ticks=2; uint32 actuator_delay_ticks=3; double command_timeout_seconds=4;
  enum Missing { HOLD=0; NEUTRAL=1; CUTOFF=2; } // NEUTRAL: gimbal and torque to zero; CUTOFF: engine off.
  Missing missing=5; uint32 sample_every_ticks=6;  // Defaults: rate 1, every 10 ticks.
}
message RealtimeStatus { bool running=1; uint64 tick=2; uint64 late_ticks=3; double worst_lag_seconds=4; uint64 policy_events=5; }
service FlightService {
  rpc CreateFlight(CreateFlightRequest) returns (FlightSample); // Replaces any current flight.
  rpc Step(StepRequest) returns (FlightSample);
  rpc GetFlight(Empty) returns (FlightSample);
  rpc EndFlight(Empty) returns (Applied);                       // Removes the vehicle from the scene.
  rpc ExportFlight(Empty) returns (stream FlightLogChunk);
  rpc ReplayFlight(stream FlightLogChunk) returns (FlightSample); // Becomes the current flight.
  rpc StartRealtime(RealtimeRequest) returns (RealtimeStatus);
  rpc StopRealtime(Empty) returns (RealtimeStatus);
}
