name: Portable releases

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Release the LFS object store
        shell: bash
        run: rm -rf .git/lfs/objects
      - name: Check asset checkout and release packager
        run: |
          python tests/asset_checkout_fixture.py
          python tests/release_fixture.py
      - name: Free hosted Linux runner space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Build and test portable Linux (Debian 12)
        if: runner.os == 'Linux'
        run: bash scripts/build-portable.sh linux
      - name: Light folder and asset containers (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/light-dist.py dist/linux dist/linux-light
          catalog=dist/linux-light/assets/catalog.json
          echo "CATALOG_PATH=$PWD/$catalog" >> "$GITHUB_ENV"
          assets=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['release'])" "$catalog")
          # Containers do not depend on the system: build them once, unless that
          # asset release already exists with every container at its exact size.
          if gh release view "$assets" --json assets,isDraft > asset-release.json 2>/dev/null \
            && python3 scripts/asset-release.py "$catalog" asset-release.json; then
            echo "Asset release $assets already complete"
          else
            python3 scripts/split-asset-pack.py dist/linux/assets/visuals.pak release-assets
            cmp "$catalog" release-assets/catalog.json
          fi
      - name: Build and test portable Windows (MSVC x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The checkout drive is small; keep build, dist and ZIP volumes on C:.
          $workspace = Join-Path ($env:SystemDrive + '\') 'albert-release'
          New-Item -ItemType Directory -Force $workspace | Out-Null
          & robocopy $env:GITHUB_WORKSPACE $workspace /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw 'Failed to prepare Windows release workspace' }
          Set-Location $workspace
          & .\make.cmd render-dist -Jobs 2
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build or tests failed' }
          & python scripts/light-dist.py dist/windows dist/windows-light
          if ($LASTEXITCODE -ne 0) { throw 'Windows light folder failed' }
          "CATALOG_PATH=$workspace\dist\windows-light\assets\catalog.json" >> $env:GITHUB_ENV
          "RELEASE_WORKSPACE=$workspace" >> $env:GITHUB_ENV
      - name: Archive portable distribution
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            version="$TAG_NAME"
          else
            version="preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then cd "$(cygpath -u "$RELEASE_WORKSPACE")"; fi
          python scripts/package-release.py "dist/$PLATFORM" release \
            --name "AlbertEngine-$version-$PLATFORM-x64"
          python scripts/package-release.py "dist/$PLATFORM-light" release \
            --name "AlbertEngine-$version-$PLATFORM-x64-light"
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "RELEASE_OUTPUT=$(cygpath -w "$(pwd)/release")" >> "$GITHUB_ENV"
          else
            echo "RELEASE_OUTPUT=$(pwd)/release" >> "$GITHUB_ENV"
          fi
      - name: Upload portable ZIP volumes
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}-x64
          path: ${{ env.RELEASE_OUTPUT }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload light catalogue
        uses: actions/upload-artifact@v4
        with:
          name: asset-catalog-${{ matrix.platform }}
          path: ${{ env.CATALOG_PATH }}
          if-no-files-found: error
          retention-days: 3
      - name: Upload asset containers
        if: runner.os == 'Linux' && hashFiles('release-assets/catalog.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: asset-containers
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Free hosted runner space for both platforms
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*-x64
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-catalog-*
          path: catalogs
      - uses: actions/download-artifact@v4
        # Absent when the asset release already holds every container; the
        # publish step verifies that release before the versioned one.
        continue-on-error: true
        with:
          name: asset-containers
          path: release-assets
      - name: Publish both platforms after all tests pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          for sums in release/*.sha256; do (cd release && sha256sum --check "$(basename "$sums")"); done
          # Asset release first: a light package must never point at missing or
          # partial containers. Both systems must expect the same catalogue.
          catalog=catalogs/asset-catalog-linux/catalog.json
          cmp "$catalog" catalogs/asset-catalog-windows/catalog.json
          assets=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['release'])" "$catalog")
          if [[ -f release-assets/catalog.json ]]; then
            cmp "$catalog" release-assets/catalog.json
            if ! gh release view "$assets" >/dev/null 2>&1; then
              gh release create "$assets" --latest=false \
                --title "Albert Engine - dados visuais ${assets#assets-}" \
                --notes "Containers de imagens baixados automaticamente pelas versões leves. Não é preciso baixá-los manualmente."
            fi
            gh release upload "$assets" release-assets/* --clobber
          fi
          # A draft (from an interrupted run) is not public: publish it, never latest.
          if [[ "$(gh release view "$assets" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$assets" --draft=false --latest=false
          fi
          gh release view "$assets" --json assets,isDraft > asset-release.json
          python3 scripts/asset-release.py "$catalog" asset-release.json
          cat > release-notes.md <<'NOTES'
          Versões portáteis para Linux x64 (glibc 2.36+) e Windows x64.
          Versão leve (`-light`): pacote pequeno; ao abrir, baixa os dados visuais essenciais
          (~63 MB) e completa o restante em segundo plano. Versão completa: tudo incluído, offline.
          Baixe todos os volumes `.zip.001`, `.zip.002`, etc. do seu sistema na mesma pasta.
          Abra `.zip.001` com 7-Zip e extraia. Abra AlbertEngine / AlbertEngine.exe na pasta extraída.
          Se houver apenas um `.zip`, extraia normalmente. A versão completa já inclui todos os assets.
          Driver OpenGL 3.3+ necessário. Nenhuma instalação do Albert é exigida.
          Os arquivos `.sha256` permitem conferir a integridade dos downloads.
          NOTES
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/* --clobber
          else
            options=()
            if [[ "$TAG_NAME" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$TAG_NAME" release/* --verify-tag \
              --title "Albert Engine $TAG_NAME" --notes-file release-notes.md "${options[@]}"
          fi
