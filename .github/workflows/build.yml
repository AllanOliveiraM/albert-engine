name: Build and tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes the running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux
          - os: windows-2022
            preset: windows
    runs-on: ${{ matrix.os }}
    steps:
      # LFS downloads count against the account bandwidth quota. Both systems
      # share one cache keyed by the LFS object IDs; only new objects are fetched.
      - uses: actions/checkout@v4
      - name: Git LFS cache key
        id: lfs
        shell: bash
        run: echo "key=lfs-v1-$(git lfs ls-files --long | sort | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: Restore Git LFS objects
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}
          restore-keys: lfs-v1-
          enableCrossOsArchive: true
      - name: Fetch missing Git LFS objects
        run: git lfs pull
      - name: Save Git LFS objects
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}
          enableCrossOsArchive: true
      - name: Release the LFS object store
        shell: bash
        run: rm -rf .git/lfs/objects
      - name: Verify asset bytes after Windows-style checkout
        run: python tests/asset_checkout_fixture.py
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/setup-linux.sh
          sudo apt-get install -y --no-install-recommends ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      # Compiled objects are reused; ccache verifies sources and flags itself.
      - name: Restore Linux compiler cache
        if: runner.os == 'Linux'
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-linux-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Grpc.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Grpc.cmake') }}-
            ccache-linux-
      - name: Configure Linux
        if: runner.os == 'Linux'
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 1500M
        run: |
          ccache --zero-stats
          cmake --preset ${{ matrix.preset }}
      - name: Windows dependency cache key
        if: runner.os == 'Windows'
        id: image
        shell: bash
        run: |
          echo "prefix=deps-windows-${ImageOS}-${ImageVersion}-" >> "$GITHUB_OUTPUT"
          echo "key=deps-windows-${ImageOS}-${ImageVersion}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Grpc.cmake', 'CMakePresets.json') }}" >> "$GITHUB_OUTPUT"
      # MSBuild skips dependency projects whose restored outputs and tracking
      # logs are current; changed sources or flags are rebuilt normally.
      - name: Restore Windows dependency build
        if: runner.os == 'Windows'
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: build/windows/_deps
          key: ${{ steps.image.outputs.key }}
          restore-keys: ${{ steps.image.outputs.prefix }}
      - name: Build Windows with bootstrap wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\make.cmd render-build 2>&1 | Tee-Object -FilePath build-windows.log
          exit $LASTEXITCODE
      # Raw logs need a login; unique errors become annotations and a summary.
      - name: Report Windows build errors
        if: failure() && runner.os == 'Windows' && hashFiles('build-windows.log') != ''
        run: python scripts/ci-errors.py build-windows.log
      # Dependencies build independently of the project sources: keep them even
      # when a later project fails, so the next attempt does not rebuild gRPC.
      - name: Save Windows dependency build
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/windows/_deps
          key: ${{ steps.image.outputs.key }}
      - name: Build Linux
        if: runner.os == 'Linux'
        env:
          CCACHE_MAXSIZE: 1500M
        run: |
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build-linux.log
          ccache --show-stats
      - name: Report Linux build errors
        if: failure() && runner.os == 'Linux' && hashFiles('build-linux.log') != ''
        run: python3 scripts/ci-errors.py build-linux.log
      - name: Save Linux compiler cache
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Tests
        run: ctest --preset ${{ matrix.preset }}
      - name: HTTP errors, retry and cancellation (Linux)
        if: runner.os == 'Linux'
        run: python3 tests/http_fixture.py build/linux/tests/download_test
      - name: HTTP errors, retry and cancellation (Windows)
        if: runner.os == 'Windows'
        run: python tests/http_fixture.py build/windows/tests/Release/download_test.exe
      - name: WMS antimeridian coverage (Linux)
        if: runner.os == 'Linux'
        run: python3 tests/wms_fixture.py build/linux/tests/wms_test
      - name: WMS antimeridian coverage (Windows)
        if: runner.os == 'Windows'
        run: python tests/wms_fixture.py build/windows/tests/Release/wms_test.exe
      - name: Executable help (Linux)
        if: runner.os == 'Linux'
        run: build/linux/bin/AlbertEngine --help
      - name: Executable help (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & build/windows/bin/Release/AlbertEngine.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
